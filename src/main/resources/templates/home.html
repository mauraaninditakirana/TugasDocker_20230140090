<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            max-width: 950px;
            margin: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
            border: 1px solid #ddd;
        }

        h1 {
            margin-bottom: 5px;
            color: #333;
            font-size: 28px;
        }

        h3 {
            color: gray;
            margin-bottom: 16px;
        }

        .btn-add {
            display: inline-block;
            padding: 10px 16px;
            background: #ff4da6;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn-add:hover {
            background: #6a4bbf;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #ff4da6;
            color: white;
            padding: 14px;
            font-size: 16px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .empty {
            color: gray;
            padding: 20px;
            font-style: italic;
        }

        .logout {
            display: inline-block;
            margin-top: 25px;
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        .logout:hover {
            text-decoration: underline;
        }

        .section-title {
            color: #444;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Website Akyuu</h1>
    <h3>Maura Anindita Kirana - 20230140090</h3>

    <a th:href="@{/form}" class="btn-add">+ Input Data Mahasiswa</a>

    <h2 class="section-title">Data Mahasiswa</h2>

    <table>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Jenis Kelamin</th>
        </tr>

        <tr th:if="${#lists.isEmpty(mahasiswaList)}">
            <td colspan="4" class="empty">Belum ada data</td>
        </tr>

        <tr th:each="mhs, stat : ${mahasiswaList}">
            <td th:text="${stat.count}"></td>
            <td th:text="${mhs.nama}"></td>
            <td th:text="${mhs.nim}"></td>
            <td th:text="${mhs.jenisKelamin}"></td>
        </tr>
    </table>

    <a th:href="@{/login}" class="logout">Logout</a>
</div>

</body>
</html>
