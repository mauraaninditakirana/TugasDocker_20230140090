<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Input</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 1px solid #ddd;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
            color: #333;
        }

        p {
            text-align: center;
            color: gray;
            font-size: 13px;
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        .radio-group {
            margin-top: 5px;
            font-size: 14px;
            color: #333;
        }

        button {
            width: 100%;
            padding: 10px;
            background: pink;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }

        button:hover {
            background: deeppink;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: deeppink;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Form Mahasiswa</h2>
    <p>Isi data dengan benar yaa ✨</p>

    <form th:action="@{/form}" th:object="${user}" method="post">

        <label>Nama</label>
        <input type="text" th:field="*{nama}" required/>

        <label>NIM</label>
        <input type="text" th:field="*{nim}" required/>

        <label>Jenis Kelamin</label>
        <div class="radio-group">
            <input type="radio" th:field="*{jenisKelamin}" value="Laki-laki" required/> Laki-laki<br>
            <input type="radio" th:field="*{jenisKelamin}" value="Perempuan"/> Perempuan
        </div>

        <button type="submit">Submit</button>
    </form>

    <a th:href="@{/home}" class="back">← Kembali ke Home</a>
</div>

</body>
</html>
